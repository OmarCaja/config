"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](pink)\
$directory\
[](bg:green fg:pink)\
$git_branch\
$git_commit\
${custom.gittag}\
$git_state\
$git_metrics\
$git_status\
[](fg:green bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[directory]
style = "bg:pink fg:bold crust"
format = "[ $path ]($style)"
truncate_to_repo = false
truncation_length = 6
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:green"
format = '[[ $symbol $branch ](fg:bold crust bg:green)]($style)'

[git_commit]
style = "bg:green"
only_detached = false
format = '[[ $hash ](fg:bold crust bg:green)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind)](fg:bold crust bg:green)]($style)'
untracked = '?${count} '
staged = '+${count} '
modified = '!${count} '
stashed = ''
renamed = '»${count} '
deleted = '✘${count} '
ahead = '⇡${count} '
diverged = '⇡${ahead_count} ⇣${behind_count} '
behind = '⇣${count} '

[custom.gittag]
command = "git tag --points-at HEAD"
when = "git describe --tags --exact-match"
style = "bg:green"
symbol = ""
format = '[[$symbol $output ](fg:bold crust bg:green)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:bold crust bg:lavender)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = "󰔛 in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
